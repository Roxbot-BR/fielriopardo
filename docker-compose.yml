version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiel-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fiel-net]

  redis:
    image: redis:7-alpine
    container_name: fiel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","--no-auth-warning","-a","${REDIS_PASSWORD}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fiel-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fiel-backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      DB_HOST:  postgres
      DB_PORT:  "5432"
      DB_NAME:  ${POSTGRES_DB}
      DB_USER:  ${POSTGRES_USER}
      DB_PASS:  ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://fielriopardo.com.br
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /opt/fielriopardo/uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [fiel-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fiel-frontend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://fielriopardo.com.br
      NEXT_PUBLIC_WS_URL:  wss://fielriopardo.com.br
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks: [fiel-net]

volumes:
  postgres_data:
  redis_data:

networks:
  fiel-net:
    driver: bridge
